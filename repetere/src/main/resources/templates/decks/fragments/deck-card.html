<aside th:fragment="deckCard(deck)"
       th:id="'deck-card-' + ${deck.id}"
       th:hx-get="${deck.status.name() == 'PROCESSING'} ? @{/decks/{id}/status(id=${deck.id})} : null"
       th:hx-trigger="${deck.status.name() == 'PROCESSING'} ? 'every 2s' : null"
       th:hx-target="'#deck-card-' + ${deck.id}"
       hx-swap="outerHTML">

    <div class="deck-header">
        <h3 class="deck-title" th:text="${deck.name}">Nombre del Mazo</h3>
        <button class="btn btn-danger"
                th:hx-delete="@{/decks/{id}(id=${deck.id})}"
                hx-target="#content"
                hx-swap="innerHTML"
                hx-confirm="Esta acción borrará el mazo para siempre. ¿Está seguro?">
            Borrar
        </button>
    </div>

    <div class="deck-info">
        <p><strong>Idioma:</strong> <span th:text="${deck.targetLanguageCode}">ES</span></p>
        <p><strong>Estado:</strong> <span th:text="${deck.status}">READY</span></p>
        <p><strong>Cartas:</strong> <span th:text="${deck.cardCount}">0</span></p>
        <p><strong>Creado:</strong> <span th:text="${#temporals.format(deck.createdAt, 'dd/MM/yyyy')}">01/01/2026</span></p>
    </div>

    <div class="deck-actions">
        <a class="btn btn-secondary"
           th:hx-get="@{/decks/{id}/cards(id=${deck.id})}"
           hx-target="#content"
           hx-swap="innerHTML">
            Ver Cartas
        </a>
        <a class="btn btn-primary"
           th:hx-get="@{/decks/{id}/study(id=${deck.id})}"
           hx-target="#content"
           hx-swap="innerHTML">
            Estudiar
        </a>
    </div>
</aside>
