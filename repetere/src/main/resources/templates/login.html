<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" color-mode="user">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Repetere</title>
    <link rel="stylesheet" th:href="@{/css/mvp.css}" href="../static/css/mvp.css">
    <link rel="stylesheet" th:href="@{/css/customStyles.css}" href="../static/css/customStyles.css">
</head>
<body class="auth-body">

<main class="auth-container">
    <header class="auth-header">
        <h1>Repetere</h1>
        <p>Iniciar Sesión</p>
    </header>

    <!-- Mensajes de alerta automáticos de Spring Security -->
    <div th:if="${param.error}" class="alert-message alert-error">
        <span>Usuario o contraseña incorrectos.</span>
    </div>

    <div th:if="${param.logout}" class="alert-message alert-info">
        <span>Has cerrado sesión correctamente.</span>
    </div>

    <!-- Formulario para Spring Security -->
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Correo Electrónico:</label>
            <input type="email" id="username" name="username" required autofocus placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
            Entrar
        </button>
    </form>

    <footer class="auth-footer">
        <a th:href="@{/}">&larr; Volver a la página principal</a>
    </footer>
</main>

</body>
</html>
