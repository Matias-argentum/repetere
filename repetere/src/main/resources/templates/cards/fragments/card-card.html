<aside th:fragment="cardCard(card)" th:id="'card-' + ${card.id}" class="form-card" style="margin: 0; display: flex; flex-direction: column; justify-content: space-between;">

    <div>
        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-color); margin-bottom: 4px;">Palabra</label>

        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px;">
            <span th:text="${card.wordTarget}" style="font-weight: bold; font-size: 1.2rem;"></span>
            <audio th:if="${card.wordTargetAudioUrl}" controls style="height: 28px; max-width: 140px;">
                <source th:src="${card.wordTargetAudioUrl}" type="audio/mpeg">
            </audio>
        </div>

        <p th:if="${card.phonetic}" th:text="${card.phonetic}" style="margin: 0 0 15px 0; color: var(--text-muted); font-style: italic; font-size: 0.9rem;"></p>
    </div>

    <div>
        <hr style="border-color: var(--border-color); margin: 15px 0;">

        <label style="display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-color); margin-bottom: 4px;">Oración</label>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <span th:text="${card.sentenceTarget}" style="font-size: 0.95rem; line-height: 1.4;"></span>
            <audio th:if="${card.sentenceTargetAudioUrl}" controls style="height: 28px; width: 100%; margin-top: 5px;">
                <source th:src="${card.sentenceTargetAudioUrl}" type="audio/mpeg">
            </audio>
        </div>
    </div>

</aside>
