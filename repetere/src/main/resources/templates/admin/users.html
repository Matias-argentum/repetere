<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="page" th:replace="~{layout/main-layout :: layout(~{::content}, ~{::title})}">
        <title>Users - Repetere</title>
    </th:block>
</head>
<body>
<div th:fragment="content">

    <div style="max-width: 900px; margin: 0 auto 15px auto;">
        <h2 style="margin-bottom: 5px;">Gestión de Usuarios</h2>
        <p style="color: var(--text-muted); margin-top: 0;">Administra los usuarios registrados en el sistema.</p>
    </div>

    <div th:fragment="users-table-div" style="max-width: 900px; margin: 0 auto;">
        <div th:if="${successMessage}" style="margin-bottom: 15px; padding: 10px; background-color: rgba(39, 174, 96, 0.1); border-left: 4px solid #27ae60; border-radius: 4px;">
            <code th:text="${successMessage}" style="color: #27ae60;"></code>
        </div>

        <!-- Tabla intacta tal como pediste -->
        <table id="users-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>EMAIL</th>
                <th>N-LANG</th>
                <th>ROLE</th>
                <th>ACTIVE</th>
                <th>FORCE-CH</th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="user : ${users}">
                <tr th:replace="~{admin/fragments/user-row :: userRow(${user})}"></tr>
            </th:block>
            </tbody>
        </table>
    </div>

    <div style="max-width: 900px; margin: 20px auto;">
        <button popovertarget="dialog-modal" id="openDialog" class="btn btn-primary">Crear nuevo usuario</button>

        <dialog popover="" id="dialog-modal">
            <h3 style="margin-top: 0;">Añadir usuario</h3>
            <hr style="border-color: var(--border-color); margin-bottom: 15px;">

            <form th:action="@{/admin/users}" method="post"
                  hx-target="#users-table"
                  hx-swap="outerHTML">

                <div th:if="${errorMessage}" style="margin-bottom: 15px; padding: 10px; background-color: rgba(247, 113, 125, 0.1); border-left: 4px solid var(--danger-color); border-radius: 4px;">
                    <code th:text="${errorMessage}" style="color: var(--danger-color);"></code>
                </div>

                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" placeholder="Nombre" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="user@email.com" required>
                </div>

                <div class="form-group">
                    <label for="role">Rol:</label>
                    <select id="role" name="role">
                        <option value="ADMIN">Admin</option>
                        <option value="USER">User</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="nativeLanguage">Idioma Nativo:</label>
                    <select id="nativeLanguage" name="nativeLanguage">
                        <option value="ES">Español</option>
                        <option value="EN">Inglés</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar</button>
            </form>
        </dialog>
    </div>

</div>
</body>
</html>
