version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: repetere-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repeteredb
    ports:
      - "3306:3306"
    volumes:
      - repetere_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: repetere-mysql
      PMA_USER: root
      PMA_PASSWORD: root

  minio:
    image: minio/minio
    container_name: repetere-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - repetere_minio_data:/data
    command: server /data --console-address ":9001"

  tts-service:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    container_name: repetere-tts
    restart: always
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: repetere-minio:9000  # Usa el container_name de MinIO
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET_NAME: repetere-audios
    depends_on:
      - minio

volumes:
  repetere_mysql_data:
  repetere_minio_data:
