version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: repetere-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repeteredb
    ports:
      - "3306:3306"
    volumes:
      - repetere_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  minio:
    image: minio/minio
    container_name: repetere-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - repetere_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  repetere_mysql_data:
  repetere_minio_data:
