<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" color-mode="user">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Repetere</title>
    <!-- Tu archivo Water.css local -->
    <link rel="stylesheet" th:href="@{/css/mvp.css}" href="../static/css/mvp.css">
</head>
<body>
<main>
    <header>
        <h1>Repetere</h1>
        <p>Iniciar Sesión</p>
    </header>

    <!-- Mensajes de alerta automáticos de Spring Security -->
    <div th:if="${param.error}">
        <p><mark>Usuario o contraseña incorrectos.</mark></p>
    </div>
    <div th:if="${param.logout}">
        <p><small>Has cerrado sesión correctamente.</small></p>
    </div>

    <!-- Formulario procesado por Spring Security -->
    <form th:action="@{/login}" method="post">
        <label for="username">Correo Electrónico:</label>
        <input type="email" id="username" name="username" required autofocus placeholder="tu@email.com">

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Entrar</button>
    </form>

    <footer>
        <p><a th:href="@{/}">&larr; Volver a la página principal</a></p>
    </footer>
</main>
</body>
</html>
